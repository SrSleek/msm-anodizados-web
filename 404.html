<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — MSM Anodizados</title>
<meta name="robots" content="noindex">
<link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/images/favicon-32.png" type="image/png" sizes="32x32">
<style>
  .notfound { min-height: 100vh; background: var(--ink); color: var(--paper); display: flex; align-items: center; padding-block: var(--space-6); }
  .notfound .code { font-family: var(--font-mono); color: var(--red); letter-spacing: 0.2em; font-size: 0.85rem; }
  .notfound h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 0.98; color: #fff; margin-top: var(--space-2); }
  .notfound p { color: #c9c8c3; margin-top: var(--space-2); max-width: 46ch; }
  .notfound .hero-ctas { margin-top: var(--space-4); }
  .notfound img { height: 48px; width: auto; margin-bottom: var(--space-4); }
</style>
</head>
<body>
<main class="notfound">
  <div class="container">
    <a href="/"><img src="/assets/images/logo-dark.webp" alt="MSM Anodizados" width="55" height="48"></a>
    <div class="code">Error 404</div>
    <h1>Esta página<br>no existe</h1>
    <p>Puede que el enlace esté mal escrito o que el artículo se haya movido. Desde aquí puedes volver al inicio o ver el blog.</p>
    <div class="hero-ctas">
      <a href="/" class="btn btn-primary">Ir al inicio</a>
      <a href="/blog/" class="btn btn-outline on-dark">Ver el blog</a>
    </div>
  </div>
</main>
</body>
</html>
